services:
  - type: web
    name: callbot-api-python
    runtime: python
    region: singapore
    plan: free
    rootDir: callbot-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_PROJECT
        value: "callbot-testcase-runner"
